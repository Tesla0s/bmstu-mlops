[project]
name = "mlops-hw67"
version = "0.1.0"
description = "Учёт экспериментов и проверка классификатора обращений GitHub"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mlflow==2.22.2", "torch==2.8.0", "transformers==4.57.6",
  "peft==0.17.1", "pyyaml==6.0.3", "psutil==7.1.0",
  "numpy==2.2.6", "SQLAlchemy==2.0.43", "dvc==3.67.1",
]
[dependency-groups]
dev = ["ruff==0.16.8"]
[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
