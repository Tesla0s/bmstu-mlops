[project]
name = "mlops-hw4"
version = "0.1.0"
description = "MLOps: токенизация обращений GitHub, единый шаблон и маска ответа"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "transformers==4.57.6",
    "numpy==2.2.6",
    "pyyaml==6.0.3",
    "dvc==3.67.1",
]

[dependency-groups]
dev = ["ruff==0.16.8"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
