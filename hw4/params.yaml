# Входные данные — неизменённый выход split версии hw3-v2.
model:
  name: "Qwen/Qwen3-0.6B"
  revision: "c1899de289a04d12100db370d81485cdf75e47ca"
  enable_thinking: false

data:
  train_jsonl: "data/train.jsonl"
  val_jsonl: "data/val.jsonl"
  out_dir: "data/tokenized"

provenance:
  hw3_directory: "../hw3"
  git_tag: "hw3-v2"
  git_commit: "b1584355b59356f5a2f0bd81c7a279fbfb83318e"
  sha256:
    train: "db0442ebeebe9ee235fdd4de6bb9251bdda4e5b0bc188e58edefb5a10143eb35"
    val: "058574c2fdaa86c25737599d257e344371509224a4591fee8a79cb182eba1063"

tokenize:
  # Максимум train после применения штатного шаблона: 2131 токен.
  # Ближайшее большее кратное 64 сохраняет весь набор; паддинг динамический.
  max_seq_len: 2176
  truncated_warn_ratio: 0.05
  padding_side: "left"

packing:
  enabled: false

batch:
  size: 8
  seed: 42

train_estimate:
  epochs: 3
  benchmark_json: "../hw1/docs/bench.json"
  training_slowdown_min: 2
  training_slowdown_max: 3
