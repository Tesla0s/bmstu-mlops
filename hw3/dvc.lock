          per_class:
            v1: 500
            v2: 800
          seed: 42
          repositories:
            microsoft/vscode:
              bug: bug
              feature_request: feature-request
              question: '*question'
            pandas-dev/pandas:
              bug: Bug
              feature_request: Enhancement
              question: Usage Question
          created_from: '2019-01-01'
          created_to: '2025-12-31'
          fetch_per_repository_class: 1000
          fetch_state: closed
          extra_searches:
          - repository: microsoft/vscode
            category: question
            created_from: '2019-01-01'
            created_to: '2023-12-31'
          page_size: 100
          reviews: reviews/label_audit.json
          question_require_explicit_intent: true
          min_english_word_share: 0.85
          title_group_threshold: 0.8
          title_group_min_words: 5
          system_prompts:
          - Classify the GitHub issue from its title and description. Use bug 
            for incorrect existing behavior, feature_request for a new 
            capability or improvement, and question for a request for usage 
            guidance. Return only a JSON object with the key "category" and one 
            of these three values.
          - 'You assist with issue triage. Read the issue title and body and choose
            bug, feature_request, or question. A bug concerns faulty existing behavior;
            a feature request asks for an improvement; a question asks how to use
            the software. Reply only with {"category": "<label>"}.'
          - 'Determine the type of this software issue: bug (existing behavior is
            wrong), feature_request (a capability or improvement is requested), or
            question (the author needs usage guidance). Output a valid JSON object
            containing only the category field.'
          - 'Assign one category to the supplied GitHub issue: bug, feature_request,
            or question. Distinguish reports of incorrect behavior from enhancement
            proposals and requests for help using the software. Respond with JSON
            only: {"category": "<chosen category>"}.'
          - Read the title and description of an issue and identify its purpose.
            Choose bug for a defect, feature_request for proposed functionality,
            or question for usage help. Your entire answer must be a JSON object
            with one category key.
        paths.metadata: data/metadata.jsonl
        paths.metrics_collect: metrics/collect.json
        paths.raw: data/raw.jsonl
