      md5: 911c40737b849ddf239c7278e7c985fd
      size: 223914
    params:
      params.yaml:
        compare:
          max_new_tokens: 40
          prompts:
          - "Title: Saving a file unexpectedly removes its last line\n\nDescription:\n\
            After updating the editor, saving a text file deletes the last line even
            though I did not edit that line. I can reproduce this with a new file
            and all extensions disabled. The file should be saved without losing any
            content."
          - "Title: Allow exporting search results as a CSV file\n\nDescription:\n\
            It would be useful to add an Export CSV button to the search results panel.
            Currently I have to copy every result manually. Please consider adding
            this capability in a future version."
          - "Title: How can I select rows matching two conditions?\n\nDescription:\n\
            I am learning pandas and have a DataFrame with age and country columns.
            What is the correct way to keep rows where age is greater than 18 and
            country is Germany? I would appreciate an example using the existing API."
          - "Title: Grouped sum returns the wrong result for negative values\n\nDescription:\n\
            A column containing -3 and -5 in the same group produces a grouped sum
            of 8 instead of -8. The ordinary sum produces -8. This worked in the previous
            release and now gives an incorrect result."
          - "Title: Add a configurable keyboard shortcut for switching profiles\n\n\
            Description:\nThe profile selector already works through the menu. I would
            like an option to assign a keyboard shortcut to switch directly to a named
            profile, so that this workflow needs fewer clicks."
          system: Classify the GitHub issue from its title and description. Use 
            bug for incorrect existing behavior, feature_request for a new 
            capability or improvement, and question for a request for usage 
            guidance. Return only a JSON object with the key "category" and one 
            of these three values.
          expected_categories:
          - bug
          - feature_request
          - question
          - bug
          - feature_request
          prompt_origin: Five synthetic GitHub issues fixed before training; not
            selected from train, val or test.
        model:
          name: Qwen/Qwen3-0.6B
          device: auto
          dtype: bfloat16
          enable_thinking: false
          revision: c1899de289a04d12100db370d81485cdf75e47ca
          attn_implementation: eager
        paths.compare: docs/compare.md
        train.cpu_threads: 6
        train.seed: 42
    outs:
    - path: docs/compare.md
      hash: md5
      md5: dd6d9bf36915bf6fed7a46b5a263b39e
      size: 4451
    - path: metrics/compare_all_layers.json
      hash: md5
      md5: f87e7a01be2b37021ecb695c24ac90ad
      size: 3001
