[project]
name = "mlops-hw8910"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["prefect==3.8.8", "fastapi==0.154.0", "uvicorn==0.54.0", "httpx==0.28.1"]
[project.optional-dependencies]
