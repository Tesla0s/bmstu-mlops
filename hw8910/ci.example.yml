# EXAMPLE ONLY. Not installed under .github/workflows and not evidence of remote CI.
name: hw8910-fast-checks
on:
  pull_request:
    paths: ["hw8910/**", "hw67/evaluation/**"]
jobs:
  fast:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hw8910
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: make check check-extra lint
