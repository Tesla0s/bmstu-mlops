apiVersion: v1
kind: ServiceAccount
metadata:
  name: monitoring
  namespace: hw11
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: hw11-monitoring
rules:
- apiGroups:
  - ''
  resources:
  - nodes
  - nodes/proxy
  - pods
  - services
  - endpoints
  - namespaces
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - replicasets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - autoscaling
  resources:
  - horizontalpodautoscalers
  verbs:
  - get
  - list
  - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: hw11-monitoring
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: hw11-monitoring
subjects:
- kind: ServiceAccount
  name: monitoring
  namespace: hw11
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: hw11
data:
  prometheus.yml: "global:\n  evaluation_interval: 5s\n  scrape_interval: 5s\nrule_files:\n\
    - /etc/prometheus/alerts.yaml\nscrape_configs:\n- job_name: hw11-api\n  kubernetes_sd_configs:\n\
    \  - namespaces:\n      names:\n      - hw11\n    role: pod\n  relabel_configs:\n\
    \  - action: keep\n    regex: hw11-api\n    source_labels:\n    - __meta_kubernetes_pod_label_app\n\
    \  - action: keep\n    regex: http\n    source_labels:\n    - __meta_kubernetes_pod_container_port_name\n\
    \  - source_labels:\n    - __meta_kubernetes_pod_name\n    target_label: pod\n\
    \  - source_labels:\n    - __meta_kubernetes_namespace\n    target_label: namespace\n\
    - job_name: kube-state-metrics\n  static_configs:\n  - targets:\n    - kube-state-metrics:8080\n\
    - authorization:\n    credentials_file: /var/run/secrets/kubernetes.io/serviceaccount/token\n\
    \  job_name: cadvisor\n  kubernetes_sd_configs:\n  - role: node\n  metric_relabel_configs:\n\
    \  - action: keep\n    regex: hw11\n    source_labels:\n    - namespace\n  - action:\
    \ keep\n    regex: container_cpu_usage_seconds_total|container_memory_working_set_bytes\n\
    \    source_labels:\n    - __name__\n  relabel_configs:\n  - replacement: kubernetes.default.svc:443\n\
    \    target_label: __address__\n  - replacement: /api/v1/nodes/$1/proxy/metrics/cadvisor\n\
    \    source_labels:\n    - __meta_kubernetes_node_name\n    target_label: __metrics_path__\n\
    \  scheme: https\n  tls_config:\n    ca_file: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt\n"
  alerts.yaml: "groups:\n- interval: 5s\n  name: hw11\n  rules:\n  - alert: HighTTFC\n\
    \    annotations:\n      summary: TTFC p95 > 1 second, at least 20 completed requests\
    \ in 1m\n    expr: histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[1m])))\n\
    \      > 1 and sum(increase(hw11_ttfc_seconds_count[1m])) >= 20\n    for: 15s\n\
    \    labels:\n      severity: warning\n  - alert: HighFailureFraction\n    annotations:\n\
    \      summary: Failure fraction > 5%, at least 20 outcomes in 1m\n    expr: (sum(rate(hw11_results_total{outcome!=\"\
    completed\"}[1m])) / sum(rate(hw11_results_total[1m])))\n      > 0.05 and sum(increase(hw11_results_total[1m]))\
    \ >= 20\n    for: 15s\n    labels:\n      severity: warning\n"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provision
  namespace: hw11
data:
  datasources.yaml: "apiVersion: 1\ndatasources:\n- access: proxy\n  isDefault: true\n\
    \  name: Prometheus\n  type: prometheus\n  uid: prom\n  url: http://prometheus:9090\n"
  dashboards.yaml: "apiVersion: 1\nproviders:\n- name: hw11\n  options:\n    path:\
    \ /var/lib/grafana/dashboards\n  type: file\n"
---
