groups:
- name: hw11
  interval: 5s
  rules:
  - alert: HighTTFC
    expr: histogram_quantile(0.95, sum by (le) (rate(hw11_ttfc_seconds_bucket[1m])))
      > 1 and sum(increase(hw11_ttfc_seconds_count[1m])) >= 20
    for: 15s
    labels:
      severity: warning
    annotations:
      summary: TTFC p95 > 1 second, at least 20 completed requests in 1m
  - alert: HighFailureFraction
    expr: (sum(rate(hw11_results_total{outcome!="completed"}[1m])) / sum(rate(hw11_results_total[1m])))
      > 0.05 and sum(increase(hw11_results_total[1m])) >= 20
    for: 15s
    labels:
      severity: warning
    annotations:
      summary: Failure fraction > 5%, at least 20 outcomes in 1m
