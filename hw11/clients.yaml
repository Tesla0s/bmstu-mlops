apiVersion: v1
kind: Pod
metadata:
  name: client-0
  namespace: hw11
  labels:
    app: hw11-client
spec:
  automountServiceAccountToken: false
  containers:
  - name: client
    image: hw11-api:1.0.1
    imagePullPolicy: IfNotPresent
    command:
    - python
    - -c
    - import time; time.sleep(86400)
    resources:
      requests:
        cpu: 20m
        memory: 40Mi
      limits:
        cpu: 500m
        memory: 192Mi
---
