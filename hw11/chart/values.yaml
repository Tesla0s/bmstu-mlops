image: hw11-api:1.0.1
replicas: 2
modelVersion: A
warmupSeconds: 20
brokenProbes: false
failWarmup: false
revision: baseline
queueCapacity: 8
concurrency: 1
cacheSize: 16
hitCpuSeconds: 0.02
missCpuSeconds: 0.16
chunkCpuSeconds: 0.025
chunkDelaySeconds: 0.1
resources:
  requests:
    cpu: 250m
    memory: 80Mi
  limits:
    cpu: "1"
    memory: 192Mi
hpa:
  enabled: false
  targetCPU: 60
  downscaleSeconds: 60
